name: Jarvis Android APK

on:
  push:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/jarvis-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-android/app/build/outputs/apk/debug/app-debug.apk

      # Un seul fichier à télécharger, sans zip : le dernier APK est publié seul sur la
      # branche jarvis-apk (remplacée à chaque fois, pour ne pas alourdir le dépôt).
      - name: Publier Jarvis.apk sur la branche jarvis-apk
        if: github.ref == 'refs/heads/ccr-ba39d770-6tseta'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk" && cd "$RUNNER_TEMP/apk"
          cp "$GITHUB_WORKSPACE/jarvis-android/app/build/outputs/apk/debug/app-debug.apk" Jarvis.apk
          git init -q -b jarvis-apk
          git add Jarvis.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Jarvis.apk (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" jarvis-apk
